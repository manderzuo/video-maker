map $http_origin $aiwork_studio_origin_denied {
 default 1;
 "" 0;
 "https://studio.gemstory.cn" 0;
}
map $http_origin $aiwork_studio_loopback_origin {
 default "";
 "https://studio.gemstory.cn" "http://127.0.0.1:4189";
}
server {
 listen 80;
 listen [::]:80;
 server_name studio.gemstory.cn;
 location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
 location / { return 301 https://studio.gemstory.cn$request_uri; }
}
server {
 listen 443 ssl http2;
 listen [::]:443 ssl http2;
 server_name studio.gemstory.cn;
 ssl_certificate /etc/letsencrypt/live/studio.gemstory.cn/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/studio.gemstory.cn/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 client_max_body_size 46m;
 if ($host != studio.gemstory.cn) { return 421; }
 if ($aiwork_studio_origin_denied = 1) { return 403; }
 location / {
  proxy_pass http://127.0.0.1:4189;
  proxy_http_version 1.1;
  proxy_set_header Host "127.0.0.1:4189";
  proxy_set_header Origin $aiwork_studio_loopback_origin;
  proxy_set_header Cookie "";
  proxy_set_header Referer "";
  proxy_set_header Connection "";
  proxy_hide_header Set-Cookie;
  proxy_read_timeout 180s;
  proxy_send_timeout 120s;
  proxy_next_upstream off;
  proxy_redirect off;
 }
}
