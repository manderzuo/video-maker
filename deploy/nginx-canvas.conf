# Review template only. No deployment was performed.
# Replace the reserved .invalid host and certificate paths only after explicit deployment approval.
# Keep the Core target fixed in server configuration; never use a client URL/query/header as proxy_pass.
map "$request_method:$uri" $studio_core_route_allowed {
    default 0;
    ~^GET:/core-api/(health|healthz|v1/models)$ 1;
    ~^GET:/core-api/v1/videos/[A-Za-z0-9._~-]+(/content)?$ 1;
    ~^GET:/core-api/v1/video-works/[A-Za-z0-9._~-]+$ 1;
    ~^POST:/core-api/v1/(assets|chat/completions|videos/generations)$ 1;
    ~^POST:/core-api/v1/video-works/[A-Za-z0-9._~-]+/continue$ 1;
    ~^POST:/core-api/v1/videos/[A-Za-z0-9._~-]+/delivery$ 1;
}
map $request_uri $studio_core_raw_path_allowed {
    default 0;
    ~^/core-api/[A-Za-z0-9/._~-]+$ 1;
}
server {
    listen 443 ssl;
    server_name studio.example.invalid;
    ssl_certificate /REVIEW_REQUIRED/studio-cert.pem;
    ssl_certificate_key /REVIEW_REQUIRED/studio-key.pem;
    root /srv/aiwork-studio/dist;
    client_max_body_size 46m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /core-api/ {
        if ($studio_core_route_allowed = 0) { return 404; }
        if ($studio_core_raw_path_allowed = 0) { return 404; }
        # No encoded or literal traversal may be normalized into a permitted path.
        if ($request_uri ~ "[?%\\\\]|/\\.\\.?(/|$)|//") { return 404; }
        proxy_pass https://core.example.invalid/;
        proxy_ssl_server_name on;
        proxy_pass_request_headers off;
        proxy_set_header Host core.example.invalid;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $content_length;
        proxy_set_header Accept $http_accept;
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_set_header Origin "";
        proxy_redirect off;
        proxy_next_upstream off;
        proxy_cache off;
        # Request URI and bodies are not logged in this key-bearing transport.
        access_log off;
    }
    location = /core-api { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
# Additional registered connections require their own fixed-target locations and
# identical method/raw-path checks. This template registers no second target.
