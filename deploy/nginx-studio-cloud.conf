map $http_origin $aiwork_cloud_origin_denied {
 default 1;
 "" 0;
 "https://studio.gemstory.cn" 0;
}
server {
 listen 80;
 listen [::]:80;
 server_name studio.gemstory.cn;
 location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
 location / { return 301 https://studio.gemstory.cn$request_uri; }
}
server {
 listen 443 ssl http2;
 listen [::]:443 ssl http2;
 server_name studio.gemstory.cn;
 ssl_certificate /etc/letsencrypt/live/studio.gemstory.cn/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/studio.gemstory.cn/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 client_max_body_size 200m;
 root /opt/aiwork-studio/cloud-current/dist;
 if ($host != studio.gemstory.cn) { return 421; }
 if ($aiwork_cloud_origin_denied = 1) { return 403; }
 location ^~ /studio-api/ {
  proxy_pass http://127.0.0.1:4188;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Origin $http_origin;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Connection "";
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 180s;
  proxy_send_timeout 120s;
  proxy_next_upstream off;
  proxy_redirect off;
  proxy_buffering off;
  add_header Cache-Control "no-store" always;
 }
 location = /healthz { proxy_pass http://127.0.0.1:4188/healthz; }
 location ~ ^/(core-api|text-api|core-proxy|text-proxy|registrations|v1|metadata|private|server|migrations|work)(/|$) { return 404; }
 location ~ /\. { return 404; }
 location ^~ /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
 location / { try_files $uri /index.html; add_header Cache-Control "no-store" always; }
}
